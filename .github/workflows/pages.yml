name: Deploy JukeBox Page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static Page artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/data
          cp index.html _site/index.html
          cat data/lostlands-2018.jukebox.json.gz.part* > _site/data/lostlands-2018.jukebox.json.gz
          gzip -t _site/data/lostlands-2018.jukebox.json.gz
          actual="$(sha256sum _site/data/lostlands-2018.jukebox.json.gz | awk '{print $1}')"
          expected="7e0b652aac543fbe89e80e8b47b5e7f0e67ac622ee20ae2426bd6d07492eb8a5"
          test "$actual" = "$expected"
          echo "primitive gzip verified: $actual"
          find _site -maxdepth 2 -type f -print -exec du -h {} \;

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
